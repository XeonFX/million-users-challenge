# The csharp-epoll-xeonfx loss lab, on this fork only: the entry's own tests on Linux, and load runs with packets
# dropped on the Postgres link and on the client link, as the scoring box's network drops them near its limit, for the
# scored version, this branch's, and the entries ranked above it. Free GitHub-hosted runners; nothing here goes to the
# challenge.
name: xeonfx loss lab
on:
  push:
    branches: [test/xeonfx-loss-lab]
  workflow_dispatch:
permissions:
  contents: read

env:
  PGHOST: 127.0.0.1
  PGPORT: 5432
  PGUSER: postgres
  PGPASSWORD: postgres
  ENTRY: submissions/csharp-epoll-xeonfx
  # the scored version: #114
  BASE: 0bc30c2
  # one loop at about half a scoring loop's rate
  USERS: 16000
  THINK: 0.25
  HOLD: 60

jobs:
  tests:
    if: ${{ !contains(github.event.head_commit.message, '[rivals]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: tools and Postgres as the challenge's CI sets it up
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client jq curl openssl
          psql -qX -d postgres -c "ALTER SYSTEM SET max_connections = 600"
          docker restart "$(docker ps -q --filter ancestor=postgres:18)"
          until pg_isready -q; do sleep 1; done
      - run: bash seed/make-seed.sh
      - run: sudo bash $ENTRY/install.sh > /dev/null
      - name: the challenge's checks (test/run.sh)
        run: bash test/run.sh $ENTRY
      - name: the entry's own tests, the server ones included
        run: |
          bash $ENTRY/build.sh
          psql -qX -d postgres -c "DROP DATABASE IF EXISTS mu_test WITH (FORCE)" -c "CREATE DATABASE mu_test TEMPLATE feed_seed"
          export MILLION_USERS_ENTRY=$PWD/$ENTRY
          export MU_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/mu_test
          export MU_ADMIN_URL=postgres://postgres:postgres@127.0.0.1:5432/postgres
          cd lab/tests
          dotnet build -c Release -v q -nologo
          dotnet bin/Release/net10.0/Verification.dll -maxThreads 2

  loss:
    if: ${{ !contains(github.event.head_commit.message, '[rivals]') }}
    name: "${{ matrix.conditions }} (loss ${{ matrix.dir }}, cpus ${{ matrix.cpus }}, think ${{ matrix.think }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # Postgres link loss % : client link loss %. "in" drops only what comes in to the server.
          # new4 is this branch's build given the connections one loop has on a 4-core box (124 of the 496).
          - { conditions: "0:0 5:5 10:10 15:15 18:18 20:20", dir: in, cpus: "0", think: "0.25", users: 16000, builds: "base new4" }
          - { conditions: "5:5 10:10 12:12 15:15", dir: both, cpus: "0", think: "0.25", users: 16000, builds: "base new4" }
          # nearer a scoring loop's rate, as far as the runner's four cores carry Postgres and the load with it
          - { conditions: "0:0 10:10 15:15", dir: in, cpus: "0", think: "0.25", users: 28000, builds: "base new4" }
          # every loop the runner's four cores give, at a low rate a loop (as 16 cores have at a million users)
          - { conditions: "0:0 10:10 15:15", dir: in, cpus: "0-3", think: "0.25", users: 16000, builds: "base new" }
          # the scoring run's think time, keep-alives and all
          - { conditions: "0:0", dir: in, cpus: "0", think: "2.5", users: 40000, builds: "base new4" }
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: bench/mload/go.mod, cache: false }
      - name: tools, Postgres and the box's kernel settings
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client jq curl iptables iproute2 util-linux ethtool
          psql -qX -d postgres -c "ALTER SYSTEM SET max_connections = 600"
          docker restart "$(docker ps -q --filter ancestor=postgres:18)"
          until pg_isready -q; do sleep 1; done
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" > /dev/null 2>&1 || true
          sudo modprobe sch_netem 2>/dev/null || echo "no sch_netem module"
          sudo bash box/setup-app-box.sh
          sudo sysctl -q -w net.ipv4.ip_local_port_range="1024 65535"
          cd bench/mload && go build -o mload .
          uname -r; nproc; grep -m1 'model name' /proc/cpuinfo; grep 'CONFIG_HZ=' "/boot/config-$(uname -r)" || true
      - run: bash seed/make-seed.sh
      - run: sudo bash $ENTRY/install.sh > /dev/null
      - name: build the scored version and this branch's
        run: |
          mkdir -p /tmp/v
          git archive "$BASE" $ENTRY | tar -x -C /tmp/v && mv /tmp/v/$ENTRY /tmp/v/base && rm -rf /tmp/v/submissions
          cp -r $ENTRY /tmp/v/new
          python3 - <<'PY'
          import shutil
          def variant(name, source, old, new):
              shutil.copytree(f"/tmp/v/{source}", f"/tmp/v/{name}")
              path = f"/tmp/v/{name}/{old[0]}"
              text = open(path).read()
              assert text.count(old[1]) == 1, (name, path)
              open(path, "w").write(text.replace(old[1], new))
          variant("new4", "new", ("Program.cs", "const int Connections = 496;"), "const int Connections = 124;")
          PY
          for b in base new new4; do bash /tmp/v/$b/build.sh > /dev/null; done
      - name: runs
        run: |
          mkdir -p lab/out && python3 lab/loss_summary.py header > lab/out/loss.tsv
          export LOSS_DIR=${{ matrix.dir }}
          for c in ${{ matrix.conditions }}; do
            for b in ${{ matrix.builds }}; do
              bash lab/loss.sh "$b-pg${c%%:*}-cl${c##*:}-$LOSS_DIR" /tmp/v/$b ${{ matrix.users }} ${{ matrix.think }} $HOLD "${c%%:*}" "${c##*:}" ${{ matrix.cpus }} || echo "$b $c: run failed"
            done
          done
          { echo '```'; column -t -s $'\t' lab/out/loss.tsv; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loss-${{ strategy.job-index }}
          path: lab/out
          retention-days: 14

  # the entries that share rank 1 with this one, each as it runs on one CPU: a commit message with [rivals] runs them
  rivals:
    name: ${{ matrix.entry }}
    if: ${{ contains(github.event.head_commit.message, '[rivals]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { entry: fsharp-kestrel-uring-delneg, pr: "" }
          - { entry: c-epoll-unorig-username, pr: "" }
          - { entry: bend-epoll-wyrmkeep, pr: "113" }
          - { entry: swift-iouring-akbashev, pr: "112" }
          - { entry: c-ammarserver-AmmarkoV, pr: "116" }
          - { entry: go-epoll-trungdlp, pr: "65" }
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: bench/mload/go.mod, cache: false }
      - name: the entry as its pull request has it, where it isn't on main
        if: ${{ matrix.pr != '' }}
        run: |
          git fetch -q https://github.com/arjaythedev/million-users-challenge "pull/${{ matrix.pr }}/head"
          git checkout -q FETCH_HEAD -- "submissions/${{ matrix.entry }}"
          git log -1 --format='%H %s' FETCH_HEAD
      - name: tools, Postgres and the box's kernel settings
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client jq curl iptables iproute2 util-linux ethtool psmisc
          psql -qX -d postgres -c "ALTER SYSTEM SET max_connections = 600"
          docker restart "$(docker ps -q --filter ancestor=postgres:18)"
          until pg_isready -q; do sleep 1; done
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" > /dev/null 2>&1 || true
          sudo modprobe sch_netem 2>/dev/null || echo "no sch_netem module"
          sudo bash box/setup-app-box.sh
          sudo sysctl -q -w net.ipv4.ip_local_port_range="1024 65535"
          cd bench/mload && go build -o mload .
      - run: bash seed/make-seed.sh
      - run: sudo bash submissions/${{ matrix.entry }}/install.sh > /dev/null
      - run: bash submissions/${{ matrix.entry }}/build.sh > /dev/null
      - name: runs
        run: |
          mkdir -p lab/out && python3 lab/loss_summary.py header > lab/out/loss.tsv
          short=$(echo "${{ matrix.entry }}" | cut -d- -f1,2)
          for c in in:0:0 in:5:5 in:10:10 in:15:15 in:18:18 both:10:10; do
            export LOSS_DIR=${c%%:*}; l=${c#*:}
            bash lab/loss.sh "$short-pg${l%%:*}-cl${l##*:}-$LOSS_DIR" submissions/${{ matrix.entry }} $USERS $THINK $HOLD "${l%%:*}" "${l##*:}" 0 || echo "$c: run failed"
          done
          { echo '```'; column -t -s $'\t' lab/out/loss.tsv; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loss-${{ matrix.entry }}
          path: lab/out
          retention-days: 14
